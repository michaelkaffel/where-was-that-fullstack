name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Client ──
      - name: Setup Node (client)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Lint client
        run: npm run lint
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}

      # ── Server ──
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Lint server
        run: npm run lint
        working-directory: server

      # Upload build artifact for deploy job
      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Deploy Frontend ──
      - name: Download client build
        uses: actions/download-artifact@v4
        with:
          name: client-build
          path: client/build

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_FRONTEND }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY_FRONTEND }}
          projectId: where-was-that-place
          channelId: live
          entryPoint: client

      # ── Deploy Backend ──
      - name: Authenticate to GCP (backend)
        uses: google-github-actions/auth@v2
        id: auth-backend
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_BACKEND }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: where-was-that-490000

      - name: Deploy Cloud Function
        run: |
          gcloud functions deploy whereWasThatServer \
            --runtime nodejs20 \
            --trigger-http \
            --allow-unauthenticated \
            --source . \
            --entry-point whereWasThatServer \
            --project where-was-that-490000 \
            --update-env-vars MONGODB_URI=${{ secrets.MONGODB_URI }},GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }},RESEND_API_KEY=${{ secrets.RESEND_API_KEY }},CLIENT_URL=${{ secrets.CLIENT_URL }}
        working-directory: server